<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1026">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Voxel Monsters</title>
  <link rel="icon" href="assets/logo.jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Voxel Monsters"></canvas>

  <!-- Intro: ADA STUDIO PRESENTS in a code font fades in/out, the ADA logo fades in, then an electric effect reveals the title -->
  <div id="intro" class="screen">
    <div class="code"><span class="prompt">&gt;</span> <span class="txt">ADA STUDIO PRESENTS</span><span class="cursor">_</span></div>
    <img class="emblem" src="assets/ada-logo.jpg" alt="">
    <canvas id="zap"></canvas>
    <div class="flash"></div>
  </div>

  <!-- Title -->
  <div id="title" class="screen passthrough">
    <h1 class="logo"><span class="w1">VOXEL</span><span class="w2">MONSTERS</span></h1>
    <button id="btn-play" class="icon-btn huge" aria-label="play">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <!-- Garage: icon-only controls -->
  <div id="garage" class="screen passthrough">
    <button id="btn-back" class="icon-btn small" aria-label="back">
      <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/></svg>
    </button>
    <div id="truck-name"></div>
    <div id="truck-blurb"></div>
    <div id="truck-stats"></div>
    <div id="trackpick">
        <button id="trk-prev" class="icon-btn small" aria-label="previous track"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
        <canvas id="trk-thumb" width="132" height="80"></canvas>
        <button id="trk-next" class="icon-btn small" aria-label="next track"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    <div id="modes">
      <button id="btn-diff" class="icon-btn" data-mode="normal" aria-label="difficulty">
        <svg viewBox="0 0 24 24"><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 17l4-5"/></svg>
        <span class="pips"><i></i><i></i><i></i></span>
      </button>
      <button id="btn-arena" class="icon-btn" aria-label="arena">
        <svg viewBox="0 0 24 24"><path d="M3 18c2-6 4.5-9 9-9s7 3 9 9"/><path d="M3 18h18"/><path d="m12 3 1.2 2.4 2.6.4-1.9 1.8.5 2.6L12 9l-2.4 1.2.5-2.6-1.9-1.8 2.6-.4z"/></svg>
      </button>
      <button id="btn-race" class="icon-btn huge" aria-label="race">
        <svg viewBox="0 0 24 24"><path d="M5 21V3"/><path d="M5 4h14l-2.5 4L19 12H5"/><path d="M9 4v8M13 4v8" /></svg>
      </button>
    </div>
    <button id="btn-prev" class="icon-btn carousel left" aria-label="previous truck">
      <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" /></svg>
    </button>
    <button id="btn-next" class="icon-btn carousel right" aria-label="next truck">
      <svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" /></svg>
    </button>
    <div id="controls">
      <button id="btn-paint" class="icon-btn" aria-label="change colour">
        <svg viewBox="0 0 24 24"><path d="M12 3C7 3 3 7 3 12s4 9 9 9c1.7 0 2-1.2 1.3-2.2-.8-1.2 0-2.8 1.5-2.8H18c1.7 0 3-1.3 3-3 0-4.4-4-9-9-9Z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
      </button>
      <button id="btn-sus" class="icon-btn" data-mode="normal" aria-label="suspension">
        <svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M8 5h8l-8 4h8l-8 4h8l-8 4h8"/></svg>
        <span class="pips"><i></i><i></i><i></i></span>
      </button>
    </div>
  </div>

  <!-- Drive: icons only. Left = floating joystick, right = gas + brake, top = exit / camera / nitro -->
  <div id="drive" class="screen passthrough">
    <button id="btn-exit" class="icon-btn small" aria-label="back to garage">
      <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <div id="nitro" aria-label="nitro">
      <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
      <div class="bar"><i id="nitro-fill"></i></div>
    </div>
    <button id="btn-cam" class="icon-btn small" aria-label="camera view">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 11 5-3v8l-5-3"/></svg>
    </button>
    <div id="race-hud">
      <div id="lapbox"><svg viewBox="0 0 24 24"><path d="M5 21V3"/><path d="M5 4h14l-2.5 4L19 12H5"/></svg><b id="lap">1/3</b></div>
      <div id="posbox"><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M12 14v4M8 20h8"/></svg><b id="pos">1/6</b></div>
      <div id="timer">0:00.00</div>
    </div>
    <div id="arena-hud">
      <div id="scorebox"><svg viewBox="0 0 24 24"><path d="M12 3 14.6 8.6 20.7 9.3 16.2 13.5 17.4 19.5 12 16.5 6.6 19.5 7.8 13.5 3.3 9.3 9.4 8.6z"/></svg><b id="score">0</b></div>
      <div id="foebox"><svg viewBox="0 0 24 24"><circle cx="12" cy="11" r="7"/><path d="M9 10h.01M15 10h.01M9 20v-3M12 20v-3M15 20v-3"/></svg><b id="foes">5</b></div>
      <div id="atimer">3:00</div>
    </div>
    <div id="hp"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/></svg><i><u id="hp-fill"></u></i></div>
    <div id="combo">x2</div>
    <button id="btn-respawn" class="icon-btn small" aria-label="respawn on track">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
    </button>
    <canvas id="minimap" width="160" height="110"></canvas>
    <div id="countdown"></div>
    <div id="wrongway"><svg viewBox="0 0 24 24"><path d="M8 20V9a4 4 0 0 1 8 0v3"/><path d="m12 9 4 4 4-4"/></svg></div>
    <div id="results">
      <div class="card">
        <svg class="skull" viewBox="0 0 24 24"><circle cx="12" cy="11" r="7"/><path d="M9 10h.01M15 10h.01M9 20v-3M12 20v-3M15 20v-3"/></svg>
        <svg class="trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg>
        <div class="row race-row"><svg viewBox="0 0 24 24"><path d="M12 3 14.6 8.6 20.7 9.3 16.2 13.5 17.4 19.5 12 16.5 6.6 19.5 7.8 13.5 3.3 9.3 9.4 8.6z"/></svg><b id="res-pos">1/6</b></div>
        <div class="row arena-row"><svg viewBox="0 0 24 24"><path d="M12 3 14.6 8.6 20.7 9.3 16.2 13.5 17.4 19.5 12 16.5 6.6 19.5 7.8 13.5 3.3 9.3 9.4 8.6z"/></svg><b id="res-score">0</b></div>
        <div class="row arena-row"><svg viewBox="0 0 24 24"><circle cx="12" cy="11" r="7"/><path d="M9 10h.01M15 10h.01M9 20v-3M12 20v-3M15 20v-3"/></svg><b id="res-wrecked">0/5</b></div>
        <div class="row"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 3h6"/></svg><b id="res-total">0:00.00</b></div>
        <div class="row race-row"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><b id="res-best">0:00.00</b></div>
        <div class="buttons">
          <button id="btn-retry" class="icon-btn" aria-label="race again"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg></button>
          <button id="btn-results-exit" class="icon-btn" aria-label="garage"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/></svg></button>
        </div>
      </div>
    </div>
    <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
    <div id="pedals">
      <button id="btn-brake" class="icon-btn pedal" aria-label="brake">
        <svg viewBox="0 0 24 24"><path d="M6 8 12 14l6-6M6 14l6 6 6-6"/></svg>
      </button>
      <div class="stack">
        <button id="btn-nitro" class="icon-btn pedal nitro" aria-label="nitro">
          <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
        </button>
        <button id="btn-gas" class="icon-btn pedal gas" aria-label="gas">
          <svg viewBox="0 0 24 24"><path d="M6 10 12 4l6 6M6 18l6-6 6 6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Portrait: turn your phone (CSS shows this only in portrait) -->
  <div id="rotate" aria-label="rotate your device">
    <div class="phone-wrap">
      <svg class="phone" viewBox="0 0 64 100"><rect x="6" y="4" width="52" height="92" rx="9"/><rect x="14" y="14" width="36" height="66" rx="3" class="scr"/><circle cx="32" cy="88" r="3"/></svg>
      <svg class="arc" viewBox="0 0 120 120"><path d="M20 78a46 46 0 0 1 80-8"/><path d="m100 70-2-17m2 17-16-4"/></svg>
    </div>
  </div>

  <div id="fatal" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
