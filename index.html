<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1026">
  <title>Voxel Racers</title>
  <link rel="icon" href="assets/logo.jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Voxel Racers"></canvas>

  <!-- Splash: Ada's Games logo -->
  <div id="splash">
    <img src="assets/logo.jpeg" alt="Alien Dimension Arcade - Ada's Games">
  </div>

  <!-- Garage preview (foundation build): truck picker with icon-only controls -->
  <div id="garage" hidden>
    <div id="truck-name"></div>
    <div id="truck-stats"></div>
    <div id="controls">
      <button id="btn-prev" class="icon-btn" aria-label="previous truck">
        <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" /></svg>
      </button>
      <button id="btn-paint" class="icon-btn" aria-label="change colour">
        <svg viewBox="0 0 24 24"><path d="M12 3C7 3 3 7 3 12s4 9 9 9c1.7 0 2-1.2 1.3-2.2-.8-1.2 0-2.8 1.5-2.8H18c1.7 0 3-1.3 3-3 0-4.4-4-9-9-9Z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
      </button>
      <button id="btn-next" class="icon-btn" aria-label="next truck">
        <svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" /></svg>
      </button>
    </div>
  </div>

  <div id="fatal" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
